# PostgreSQL for the backend test suite. Throwaway: data lives in tmpfs and
# durability is switched off, because nothing here is worth keeping.
#
#   docker compose -f docker-compose.test.yml up -d
#   cd backend && pytest -n 4         # picks up localhost:55433 by default
#
# Uses its own project name and port, so it never touches the development
# stack's database, nor the Community edition's test database (which is on 55432).
name: syncrofin-enterprise-test

services:
  db-test:
    image: docker.io/pgvector/pgvector:pg16
    ports:
      - "55433:5432"
    environment:
      POSTGRES_PASSWORD: postgres
    tmpfs:
      - /var/lib/postgresql/data
    command: >
      postgres -c fsync=off -c synchronous_commit=off -c full_page_writes=off
      -c max_connections=200
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 20
