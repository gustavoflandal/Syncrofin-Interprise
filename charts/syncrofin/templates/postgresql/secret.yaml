{{- if .Values.postgresql.enabled }}
{{- if not .Values.postgresql.password }}
{{- fail "postgresql.password is required while postgresql.enabled is true: --set postgresql.password=$(openssl rand -hex 24)" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "syncrofin.fullname" . }}-postgresql
  labels:
    {{- include "syncrofin.labels" . | nindent 4 }}
type: Opaque
data:
  password: {{ .Values.postgresql.password | toString | b64enc | quote }}
{{- end }}
