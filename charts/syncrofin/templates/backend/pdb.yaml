{{- if and .Values.backend.replicaCount (gt (int .Values.backend.replicaCount) 1) }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "syncrofin.fullname" . }}-backend
  labels:
    {{- include "syncrofin.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  minAvailable: 1
  selector:
    matchLabels:
      {{- include "syncrofin.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: backend
{{- end }}
