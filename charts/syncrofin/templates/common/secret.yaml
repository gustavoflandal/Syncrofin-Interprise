{{- if not .Values.global.existingSecret }}
{{- /* Fail at render time, with the fix in the message, instead of at pod start. */ -}}
{{- if not .Values.secret.secretKey }}
{{- fail "secret.secretKey is required. Generate one and pass it: --set secret.secretKey=$(openssl rand -hex 32)" }}
{{- end }}
{{- if and (eq (toString .Values.config.agentsEnabled) "true") (not .Values.secret.agentsMcpJwtSecret) }}
{{- fail "secret.agentsMcpJwtSecret is required while config.agentsEnabled is true: --set secret.agentsMcpJwtSecret=$(openssl rand -hex 32)" }}
{{- end }}
{{- if and .Values.postgresql.enabled (not .Values.postgresql.password) }}
{{- fail "postgresql.password is required while postgresql.enabled is true: --set postgresql.password=$(openssl rand -hex 24)" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "syncrofin.fullname" . }}-secrets
  labels:
    {{- include "syncrofin.labels" . | nindent 4 }}
type: Opaque
data:
  {{- range $key, $value := .Values.secret }}
  {{- if $value }}
  {{ $key | snakecase | upper }}: {{ tpl (print $value) $ | b64enc | quote }}
  {{- end }}
  {{- end }}
{{- end }}
